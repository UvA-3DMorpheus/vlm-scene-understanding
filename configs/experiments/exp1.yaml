# Experiment 1.0: material identification from a single image.
# Questions: every labelled object (smoke photos, simulated scenes with a material class) in every
# view (camera x input condition). Three prompt variants: closed set, open set, closed set with reasoning.
variants: [v1, v2, v3]
models: [dummy]
seed: 0
options:
  # Roles: the primary dataset is the benchmark and the only headline; secondary datasets are
  # reported beside it for comparison; sanity datasets only show the pipeline works on real images.
  # No reported number mixes datasets.
  datasets: [sim_realistic, sim_preview, smoke]
  dataset_roles: {sim_realistic: primary, sim_preview: secondary, smoke: sanity}
  # front is the Morpheus style level view; the other four see motion toward or away from the camera.
  sim_cameras: [front, left, right, high, low]
  # frame: whole first frame; crop: object cut along its mask; outline: whole frame with the
  # object's mask boundary drawn in red (visual prompt without losing context).
  sim_conditions: [frame, crop, outline]
  # One extra question per scene with the first frame of every camera in one prompt.
  sim_multiview: true
  frame_index: 0
  crop_margin: 0.2
  only_passing_scenes: false
notes: >
  The closed set listed in the prompt is the label set of the dataset: the material table keys
  for the smoke photos, the five materials.json classes for simulated scenes.
